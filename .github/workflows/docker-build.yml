name: Build and publish image

# Moves the expensive part of deploying (compiling the whole app) off the
# small VPS entirely — GitHub's runners have real RAM/disk, so this is
# where the OOM/disk-pressure fight that used to happen on the VPS itself
# (see scripts/rebuild.sh) belongs instead. The VPS's job shrinks to
# `docker compose pull` + restart.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr.io requires an all-lowercase image path; github.repository
      # preserves the account/repo's actual casing (DustyCupcake/Orchard),
      # which buildx then rejects outright — lowercase it explicitly
      # rather than relying on the repo/account name ever being lowercase.
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Same fast-fail lint+tsc pass scripts/rebuild.sh runs locally,
      # before paying for the full build — cacheonly since nothing ever
      # runs this stage's image, only its exit code.
      - name: Lint + typecheck
        uses: docker/build-push-action@v6
        with:
          context: .
          target: checks
          push: false
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
