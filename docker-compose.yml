services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MAX_OLD_SPACE_MB: ${BUILD_MAX_OLD_SPACE_MB:-1536}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_OPTIONS: --max-old-space-size=${APP_MAX_OLD_SPACE_MB:-384}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      DOMAIN_EMAIL: ${DOMAIN_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  default:
    # The daemon-level "ipv6": true in /etc/docker/daemon.json only governs
    # the implicit default bridge — a Compose project gets its own network
    # and does NOT inherit that automatically. Without this, caddy/app have
    # no route out at all on an IPv6-only VPS (no IPv4 to fall back to),
    # which is exactly what broke Let's Encrypt/ZeroSSL reachability here.
    #
    # A DIFFERENT /48 than the daemon's own fixed-cidr-v6 (fd00:dead:beef::/48)
    # — not a /64 carved out of it. Docker's IPAM rejects a pool that overlaps
    # another pool's already-declared range, even a subset, and the default
    # bridge declares the WHOLE fd00:dead:beef::/48 as its own the moment
    # that's set in daemon.json. fd00:c0ff:ee00::/64 shares no prefix with
    # that /48, so there's nothing to overlap.
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:c0ff:ee00::/64
